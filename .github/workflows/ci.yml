name: CI/CD Railway

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Compilar ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [api, app]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Descargar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Preparar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # La base actual tiene errores de ESLint. Se reportan sin ocultar fallos de compilación.
      - name: Lint del frontend (informativo)
        id: lint
        if: matrix.project == 'app'
        continue-on-error: true
        run: npm run lint
      - name: Reportar deuda de lint
        if: steps.lint.outcome == 'failure'
        run: echo '::warning::El frontend tiene errores de ESLint pendientes. Consulta el paso de lint.'

  docker:
    name: Probar y conservar imagen Docker
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    # Base efímera solo para CI; no forma parte de la imagen ni del despliegue.
    services:
      postgres:
        image: postgres:15-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: ambienta_ci
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ambienta_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      API_IMAGE: ambienta-pos-api:ci
      POSTGRES_URL: postgresql://postgres:ci-test-password@127.0.0.1:5432/ambienta_ci
      JWT_SEED: ci-only-jwt-seed-for-container-smoke-tests
    steps:
      - name: Descargar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Preparar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Preparar Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Nombrar versión de la imagen
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          build_date="$(TZ=America/Managua date +'%Y-%m-%d')"
          version="ambienta-pos-${build_date}-${GITHUB_SHA:0:7}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$image:$version" >> "$GITHUB_OUTPUT"
      - name: Construir imagen de prueba
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: ${{ env.API_IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validar Compose y arrancar API
        run: |
          docker compose --project-name ambienta-ci config --quiet
          docker run --detach --name ambienta-api-ci --network host \
            --env POSTGRES_URL --env JWT_SEED \
            --health-interval=2s --health-start-period=5s \
            "$API_IMAGE"
          timeout 120s bash -c 'until [ "$(docker inspect --format "{{.State.Health.Status}}" ambienta-api-ci)" = healthy ]; do sleep 2; done'
      - name: Probar API, frontend y WebSocket
        run: node scripts/docker-smoke.mjs
      - name: Iniciar sesión en GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Conservar la imagen validada en GitHub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          VERSIONED_IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker tag "$API_IMAGE" "$VERSIONED_IMAGE"
          docker push "$VERSIONED_IMAGE"
          echo "Imagen publicada: \`$VERSIONED_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Logs de diagnóstico
        if: failure()
        run: docker logs --tail=100 ambienta-api-ci
      - name: Limpiar API de prueba
        if: always()
        run: docker rm --force ambienta-api-ci || true

  deploy:
    name: Desplegar en Railway
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.RAILWAY_PUBLIC_URL }}
    concurrency:
      group: railway-production
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
    steps:
      - name: Descargar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Comprobar que el commit sigue siendo el último de main
        id: current
        shell: bash
        run: |
          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Hay un commit más reciente en main; se omite este deploy.'
          fi
      - name: Validar configuración de Railway
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo '::error::Configura el secret RAILWAY_TOKEN y la variable RAILWAY_SERVICE_ID. Consulta docs/deployment.md.'
            exit 1
          fi
      - name: Preparar Node.js
        if: steps.current.outputs.deploy == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Instalar Railway CLI
        if: steps.current.outputs.deploy == 'true'
        run: npm install --global @railway/cli@5.71.0 --no-audit --no-fund
      - name: Desplegar y esperar el resultado
        if: steps.current.outputs.deploy == 'true'
        run: railway up --service "$RAILWAY_SERVICE_ID" --ci --message "GitHub ${GITHUB_SHA}"
      - name: Verificar URL pública
        if: steps.current.outputs.deploy == 'true' && vars.RAILWAY_PUBLIC_URL != ''
        env:
          SMOKE_BASE_URL: ${{ vars.RAILWAY_PUBLIC_URL }}
        run: node scripts/docker-smoke.mjs
